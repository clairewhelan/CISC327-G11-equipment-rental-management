name: Equipment Rental Management CI

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronized, reopened]

jobs:
  testing:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./equipment-rental-management
    
    steps:
      - name: Checkout code  
        uses: actions/checkout@v5
        
      - name: Set up Python 3.10 or later
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      
      - name: Install dependencies from requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests with coverage
        run: |
          python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90
    
